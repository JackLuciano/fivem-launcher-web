name: fivem-panel

services:
  panel:
    build: .
    image: fivem-panel:latest
    container_name: fivem-panel
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - panel-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r) => { process.exitCode = r.ok ? 0 : 1 }, () => { process.exitCode = 1 })"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  panel-data:

networks:
  default:
    name: ${PANEL_NETWORK:-proxy}
    external: true
